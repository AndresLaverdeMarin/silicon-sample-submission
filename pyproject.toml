[project]
name = "silicon-sample-submission"
version = "0.1.0"
description = "Tier-1 silicon sample for the Silicon Sample Benchmark — synthetic population, prose personas, and simulated survey replies."
readme = "README.md"
requires-python = ">=3.11"

# The sim/ pipeline. `population/` needs nothing but the standard library, and
# the benchmark's own validator is R (scripts/), so neither is covered here.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
# Stages 2 and 3 run local weights through vLLM. Kept optional so the persona
# stages install and run on a machine with no GPU.
generate = [
    "vllm>=0.19",
    "transformers>=4.45",
]

[tool.uv]
package = false
